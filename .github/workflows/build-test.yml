name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build TouchStone
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Build project
        run: |
          xcodebuild clean build \
            -project TouchStone.xcodeproj \
            -scheme TouchStone \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-14
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Run UI tests for screenshots
        run: |
          xcodebuild test \
            -project TouchStone.xcodeproj \
            -scheme TouchStoneUITests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:TouchStoneUITests/ScreenshotTests/testCaptureAllScreenshots || true

      - name: Extract screenshots from xcresult
        id: extract
        run: |
          mkdir -p screenshots
          if [ -d "TestResults.xcresult" ]; then
            echo "=== Extracting attachments using xcresulttool ==="

            # Get the test results as JSON and extract attachment IDs
            xcrun xcresulttool get --path TestResults.xcresult --format json > results.json 2>/dev/null || true

            # Export all attachments from the test results
            # First, get the actions invocation record
            ACTIONS_ID=$(cat results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          actions = data.get('actions', {}).get('_values', [])
          for action in actions:
              result = action.get('actionResult', {}).get('testsRef', {}).get('id', {}).get('_value')
              if result:
                  print(result)
                  break
          " 2>/dev/null || true)

            if [ -n "$ACTIONS_ID" ]; then
              echo "Found actions ID: $ACTIONS_ID"
              xcrun xcresulttool get --path TestResults.xcresult --format json --id "$ACTIONS_ID" > tests.json 2>/dev/null || true
            fi

            # Try direct export of all attachments
            echo "=== Trying xcresulttool export ==="
            xcrun xcresulttool export --path TestResults.xcresult --output-path screenshots --type directory 2>/dev/null || true

            # Also try getting attachments from summaries
            echo "=== Getting test summaries ==="
            xcrun xcresulttool get --path TestResults.xcresult --format json 2>/dev/null | python3 -c "
          import json, sys, subprocess, os

          def find_attachments(obj, path=''):
              attachments = []
              if isinstance(obj, dict):
                  # Check if this is an attachment reference
                  if obj.get('_type', {}).get('_name') == 'ActionTestAttachment':
                      payload_ref = obj.get('payloadRef', {}).get('id', {}).get('_value')
                      name = obj.get('name', {}).get('_value', 'unnamed')
                      if payload_ref:
                          attachments.append((payload_ref, name))
                  # Recurse into all values
                  for k, v in obj.items():
                      attachments.extend(find_attachments(v, f'{path}.{k}'))
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      attachments.extend(find_attachments(v, f'{path}[{i}]'))
              return attachments

          try:
              data = json.load(sys.stdin)
              attachments = find_attachments(data)
              print(f'Found {len(attachments)} attachments', file=sys.stderr)
              for ref_id, name in attachments:
                  print(f'{ref_id}|{name}')
          except Exception as e:
              print(f'Error: {e}', file=sys.stderr)
          " 2>&1 | while IFS='|' read -r ref_id name; do
              if [ -n "$ref_id" ] && [ "$ref_id" != "Found"* ]; then
                # Clean the name for filename
                clean_name=$(echo "$name" | tr ' ' '_' | tr -cd '[:alnum:]_-')
                echo "Exporting attachment: $name (ID: $ref_id)"
                xcrun xcresulttool export --path TestResults.xcresult --output-path "screenshots/${clean_name}.png" --type file --id "$ref_id" 2>/dev/null || true
              fi
            done

            echo "=== Screenshots directory ==="
            ls -la screenshots/ 2>/dev/null || echo "Screenshots dir empty"
            COUNT=$(find screenshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) 2>/dev/null | wc -l | tr -d ' ')
            echo "Found $COUNT screenshots"
            echo "screenshot_count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "No xcresult bundle found"
            echo "screenshot_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Post screenshots to PR
        if: steps.extract.outputs.screenshot_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const screenshotArtifact = artifacts.artifacts.find(a => a.name === 'ui-screenshots');
            const artifactUrl = screenshotArtifact
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${screenshotArtifact.id}`
              : null;

            let body = `## 📸 UI Screenshots\n\n`;
            body += `Screenshots have been captured for this PR.\n\n`;
            if (artifactUrl) {
              body += `**[Download Screenshots](${artifactUrl})**\n\n`;
            }
            body += `### Captured Screens:\n`;
            body += `- 01-Flow (Today's Flow view)\n`;
            body += `- 02-Calendar (Calendar view)\n`;
            body += `- 03-Plan (Projects list)\n`;
            body += `- 04-Me (User profile)\n\n`;
            body += `*Screenshots captured at: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📸 UI Screenshots')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
