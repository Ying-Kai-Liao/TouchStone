name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test TouchStone
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Build project
        run: |
          xcodebuild clean build \
            -project TouchStone.xcodeproj \
            -scheme TouchStone \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-14
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Run UI tests for screenshots
        run: |
          xcodebuild test \
            -project TouchStone.xcodeproj \
            -scheme TouchStoneUITests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:TouchStoneUITests/ScreenshotTests/testCaptureAllScreenshots || true

      - name: Extract screenshots from xcresult
        id: extract
        run: |
          mkdir -p screenshots
          if [ -d "TestResults.xcresult" ]; then
            # Find attachments in xcresult bundle (they're in Data folder with refs)
            find TestResults.xcresult -type f \( -name "*.png" -o -name "*.jpg" \) -exec cp {} screenshots/ \; 2>/dev/null || true

            # Also check the Attachments directory structure
            if [ -d "TestResults.xcresult/Data" ]; then
              for f in TestResults.xcresult/Data/*; do
                if file "$f" 2>/dev/null | grep -q "PNG\|JPEG"; then
                  cp "$f" "screenshots/$(basename $f).png" 2>/dev/null || true
                fi
              done
            fi

            COUNT=$(ls -1 screenshots/*.png 2>/dev/null | wc -l | tr -d ' ')
            echo "Found $COUNT screenshots"
            echo "screenshot_count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "No xcresult bundle found"
            echo "screenshot_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Post screenshots to PR
        if: steps.extract.outputs.screenshot_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const screenshotArtifact = artifacts.artifacts.find(a => a.name === 'ui-screenshots');
            const artifactUrl = screenshotArtifact
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${screenshotArtifact.id}`
              : null;

            let body = `## 📸 UI Screenshots\n\n`;
            body += `Screenshots have been captured for this PR.\n\n`;
            if (artifactUrl) {
              body += `**[Download Screenshots](${artifactUrl})**\n\n`;
            }
            body += `### Captured Screens:\n`;
            body += `- 01-Flow (Today's Flow view)\n`;
            body += `- 02-Calendar (Calendar view)\n`;
            body += `- 03-Plan (Projects list)\n`;
            body += `- 04-Me (User profile)\n\n`;
            body += `*Screenshots captured at: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📸 UI Screenshots')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
