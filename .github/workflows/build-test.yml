name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build TouchStone
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Build project
        run: |
          xcodebuild clean build \
            -project TouchStone.xcodeproj \
            -scheme TouchStone \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Capture UI Screenshots
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi

      - name: Run UI tests for screenshots
        run: |
          xcodebuild test \
            -project TouchStone.xcodeproj \
            -scheme TouchStoneUITests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:TouchStoneUITests/ScreenshotTests/testCaptureAllScreenshots || true

      - name: Extract screenshots from xcresult
        id: extract
        run: |
          mkdir -p screenshots
          if [ -d "TestResults.xcresult" ]; then
            echo "=== Exporting attachments using xcresulttool ==="

            # Use the new export attachments command (Xcode 16+)
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path screenshots

            echo "=== Screenshots directory ==="
            ls -la screenshots/

            # Rename files using manifest
            if [ -f "screenshots/manifest.json" ]; then
              echo "=== Renaming screenshots ==="
              python3 << 'EOF'
          import json
          import os
          import shutil

          with open('screenshots/manifest.json', 'r') as f:
              manifest = json.load(f)

          for test in manifest:
              for attachment in test.get('attachments', []):
                  exported = attachment.get('exportedFileName', '')
                  suggested = attachment.get('suggestedHumanReadableName', '')
                  if exported and suggested:
                      # Extract the base name (e.g., "01-Flow" from "01-Flow_0_UUID.png")
                      parts = suggested.split('_')
                      if parts:
                          simple_name = parts[0] + '.png'
                          src = f'screenshots/{exported}'
                          dst = f'screenshots/{simple_name}'
                          if os.path.exists(src):
                              shutil.copy(src, dst)
                              print(f'Renamed: {exported} -> {simple_name}')
          EOF
              ls -la screenshots/
            fi

            # Count image files
            COUNT=$(find screenshots -type f -name "*.png" 2>/dev/null | wc -l | tr -d ' ')
            echo "Found $COUNT screenshots"
            echo "screenshot_count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "No xcresult bundle found"
            echo "screenshot_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Push screenshots to branch
        if: steps.extract.outputs.screenshot_count != '0'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BRANCH_NAME="screenshots/pr-${PR_NUMBER}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch for screenshots
          git checkout --orphan "$BRANCH_NAME"
          git reset --hard

          # Copy only the renamed screenshots (01-Flow.png, etc.)
          mkdir -p screenshots
          cp /Users/runner/work/TouchStone/TouchStone/screenshots/0*.png screenshots/ 2>/dev/null || true

          # Commit and push
          git add screenshots/
          git commit -m "Screenshots for PR #${PR_NUMBER}" || echo "No changes to commit"
          git push -f origin "$BRANCH_NAME"

          echo "Screenshots pushed to branch: $BRANCH_NAME"

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Post screenshots to PR
        if: steps.extract.outputs.screenshot_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const branch = `screenshots/pr-${prNumber}`;
            const baseUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/screenshots`;

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const screenshotArtifact = artifacts.artifacts.find(a => a.name === 'ui-screenshots');
            const artifactUrl = screenshotArtifact
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${screenshotArtifact.id}`
              : null;

            let body = `## 📸 UI Screenshots\n\n`;

            // Add images in a 2x2 grid using HTML table
            body += `<table>\n`;
            body += `<tr>\n`;
            body += `<td align="center"><strong>Flow</strong><br><img src="${baseUrl}/01-Flow.png" width="300"/></td>\n`;
            body += `<td align="center"><strong>Calendar</strong><br><img src="${baseUrl}/02-Calendar.png" width="300"/></td>\n`;
            body += `</tr>\n`;
            body += `<tr>\n`;
            body += `<td align="center"><strong>Plan</strong><br><img src="${baseUrl}/03-Plan.png" width="300"/></td>\n`;
            body += `<td align="center"><strong>Me</strong><br><img src="${baseUrl}/04-Me.png" width="300"/></td>\n`;
            body += `</tr>\n`;
            body += `</table>\n\n`;

            if (artifactUrl) {
              body += `**[📥 Download Full Resolution](${artifactUrl})**\n\n`;
            }
            body += `*Screenshots captured at: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📸 UI Screenshots')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
